name: LamLauncher CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches:
      - v3_openjdk
      - main
      - lamlauncher-*
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    
    steps:
      - name: Checkout LamLauncher
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 17 for build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: Get LTW library
        run: |
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav

      - name: Get JRE 17
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-pojav

      - name: Get JRE 21
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-pojav

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
          cache-read-only: false

      - name: Build language list and JRE JAR files
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Build LamLauncher Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --stacktrace
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/lamlauncher-debug.apk

      - name: Build LamLauncher without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle :app_pojavlauncher:assembleDebug --stacktrace
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/lamlauncher-debug-noruntime.apk

      - name: Generate checksums
        run: |
          cd out
          md5sum lamlauncher-debug.apk > lamlauncher-debug.md5
          sha256sum lamlauncher-debug.apk > lamlauncher-debug.sha256
          md5sum lamlauncher-debug-noruntime.apk > lamlauncher-debug-noruntime.md5
          sha256sum lamlauncher-debug-noruntime.apk > lamlauncher-debug-noruntime.sha256

      - name: Upload LamLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: lamlauncher-debug
          path: |
            out/lamlauncher-debug.apk
            out/lamlauncher-debug.md5
            out/lamlauncher-debug.sha256
          retention-days: 90

      - name: Upload LamLauncher APK (no runtime)
        uses: actions/upload-artifact@v4
        with:
          name: lamlauncher-debug-noruntime
          path: |
            out/lamlauncher-debug-noruntime.apk
            out/lamlauncher-debug-noruntime.md5
            out/lamlauncher-debug-noruntime.sha256
          retention-days: 90

      - name: Build Google Play Bundle (if authorized)
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleGplay --stacktrace
          mv app_pojavlauncher/build/outputs/bundle/gplay/app_pojavlauncher-gplay.aab out/lamlauncher-gplay.aab

      - name: Upload Google Play Bundle
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        uses: actions/upload-artifact@v4
        with:
          name: lamlauncher-release-bundle
          path: out/lamlauncher-gplay.aab
          retention-days: 90

      - name: Upload to Google Play Internal Testing
        continue-on-error: true
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_JSON }}
          packageName: net.lamlauncher.app
          releaseFiles: out/lamlauncher-gplay.aab
          track: internal
          inAppUpdatePriority: 5

      - name: Create build summary
        if: success()
        run: |
          echo "## 🎉 LamLauncher Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts Generated:" >> $GITHUB_STEP_SUMMARY
          echo "- **lamlauncher-debug.apk** - Full version with JRE 8, 17, 21" >> $GITHUB_STEP_SUMMARY
          echo "- **lamlauncher-debug-noruntime.apk** - Smaller version without JRE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 File Sizes:" >> $GITHUB_STEP_SUMMARY
          ls -lh out/*.apk | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Checksums:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat out/*.md5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY


